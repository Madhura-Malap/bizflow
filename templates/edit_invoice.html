{% extends "dashboard_base.html" %}

{% block title %}Edit Invoice{% endblock %}

{% block dashboard_content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Invoice</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Invoice Number</label>
                    <input type="text"
                           class="form-control"
                           value="{{ invoice.invoice_number }}"
                           readonly>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Client</label>

                    <select class="form-control" name="client_id">

                        {% for client in clients %}

                        <option value="{{ client.id }}"
                        {% if client.id == invoice.client_id %}selected{% endif %}>
                            {{ client.company_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4 mb-3">
                    <label>Project</label>

                    <select class="form-control" name="project_id">

                        {% for project in projects %}

                        <option value="{{ project.id }}"
                        {% if project.id == invoice.project_id %}selected{% endif %}>
                            {{ project.project_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4 mb-3">
                    <label>Subtotal</label>

                    <input
                        type="number"
                        class="form-control"
                        id="subtotal"
                        name="subtotal"
                        value="{{ '%.2f'|format(invoice.total) }}"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label>GST (%)</label>

                    <select
                        class="form-control"
                        id="gst"
                        name="gst">

                        <option value="5"
                        {% if invoice.gst==5 %}selected{% endif %}>5%</option>

                        <option value="12"
                        {% if invoice.gst==12 %}selected{% endif %}>12%</option>

                        <option value="18"
                        {% if invoice.gst==18 %}selected{% endif %}>18%</option>

                        <option value="28"
                        {% if invoice.gst==28 %}selected{% endif %}>28%</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Total</label>

                    <input
                        type="number"
                        class="form-control"
                        id="total"
                        name="total"
                        value="{{ invoice.total }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Invoice Date</label>

                    <input
                        type="date"
                        class="form-control"
                        name="invoice_date"
                        value="{{ invoice.invoice_date }}"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Due Date</label>

                    <input
                        type="date"
                        class="form-control"
                        name="due_date"
                        value="{{ invoice.due_date }}"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Status</label>

                    <select
                        class="form-control"
                        name="payment_status">

                        <option {% if invoice.payment_status=="Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option {% if invoice.payment_status=="Paid" %}selected{% endif %}>
                            Paid
                        </option>

                        <option {% if invoice.payment_status=="Overdue" %}selected{% endif %}>
                            Overdue
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn btn-warning">
                Update Invoice
            </button>

            <a href="/invoices" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

<script>

const subtotal = document.getElementById("subtotal");
const gst = document.getElementById("gst");
const total = document.getElementById("total");

function calculateTotal(){

    let sub = parseFloat(subtotal.value) || 0;
    let gstRate = parseFloat(gst.value) || 0;

    total.value = (sub + (sub * gstRate / 100)).toFixed(2);
}

subtotal.addEventListener("input", calculateTotal);
gst.addEventListener("change", calculateTotal);

</script>

{% endblock %}
