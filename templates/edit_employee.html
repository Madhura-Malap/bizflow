{% extends "dashboard_base.html" %}

{% block title %}Edit Employee{% endblock %}

{% block dashboard_content %}

<div class="container mt-5" style="max-width: 1050px;"></div>

    <h3 class="mb-4">Edit Employee</h3>

<form method="POST">

    <div class="card shadow p-4">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Employee Name</label>
                <input type="text"
                       class="form-control"
                       name="employee_name"
                       value="{{ employee.employee_name }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input type="email"
                       class="form-control"
                       name="email"
                       value="{{ employee.email }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Phone</label>
                <input type="text"
                       class="form-control"
                       name="phone"
                       value="{{ employee.phone }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Department</label>
                <input type="text"
                       class="form-control"
                       name="department"
                       value="{{ employee.department }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Designation</label>
                <input type="text"
                       class="form-control"
                       name="designation"
                       value="{{ employee.designation }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Salary</label>
                <input type="number"
                       class="form-control"
                       name="salary"
                       value="{{ employee.salary }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Joining Date</label>
                <input type="date"
                       class="form-control"
                       name="joining_date"
                       value="{{ employee.joining_date }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Status</label>

                <select class="form-control" name="status">
                    <option {% if employee.status=="Active" %}selected{% endif %}>Active</option>
                    <option {% if employee.status=="On Leave" %}selected{% endif %}>On Leave</option>
                    <option {% if employee.status=="Resigned" %}selected{% endif %}>Resigned</option>
                </select>
            </div>

<div class="mt-3">

    <button type="submit" class="btn btn-warning">
        Update Employee
    </button>

    <a href="/employees" class="btn btn-secondary">
        Cancel
    </a>

</div>

    </div>

</form>

</div>

{% endblock %}
